name: Publicar no GitHub Pages
# Hospedagem gratuita (repositório público). Sem as variáveis do Supabase,
# publica o MODO DEMONSTRAÇÃO; com elas, publica a versão real multiusuário.
# Variáveis: Settings → Secrets and variables → Actions → aba "Variables":
#   VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY (chave anon/publishable é pública por natureza).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_ROUTER: hash
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_DEMO: ${{ vars.VITE_SUPABASE_URL == '' && 'true' || 'false' }}
        run: npx vite build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
