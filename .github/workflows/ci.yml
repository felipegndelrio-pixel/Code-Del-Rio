name: CI
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      # NexoProcess (apps/nexoprocess)
      - run: npm run nexo:typecheck
      - run: npm run nexo:test
      - run: npx vite build --config apps/nexoprocess/vite.config.ts
      - run: npm run nexo:check-bundle
      # CSP e cabeçalhos reais do public/_headers, servidos pelo wrangler pages dev
      - run: npm run nexo:test:csp
      # API de acesso (functions + workerd) com Supabase falso: webhook → ativação → reembolso
      - run: npm run nexo:test:api
  nexoprocess-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run nexo:e2e
        env:
          CI: 'true'
      # Todas as rotas e exportações com a CSP real e service worker ativo (usa o dist do E2E)
      - run: npm run nexo:test:csp:rotas
